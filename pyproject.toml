[tool.ruff]
    target-version = "py312"
    line-length = 120
    exclude = [
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "node_modules",
        "venv",
        "vtmp",
    ]

[tool.ruff.lint]
    select = [
        "E",      # pycodestyle errors
        "W",      # pycodestyle warnings
        "F",      # Pyflakes
        "UP",     # pyupgrade
        "B",      # flake8-bugbear
        "C4",     # flake8-comprehensions
        "I",      # isort
        "S",      # flake8-bandit
        "T20",    # flake8-print
        "PT",     # flake8-pytest-style
        "Q",      # flake8-quotes
        "N",      # pep8-naming
        # "D",      # pydocstyle
    ]
    ignore = [
        "S108", # Probable insecure usage of temporary file or directory: "/tmp"
        "S603", # `subprocess` call: check for execution of untrusted input
        "S101", # Use of `assert` detected
        "B011", # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
        "PT015", # Assertion always fails, replace with `pytest.fail()
        "T201", # print found
        # "PT028", # Test function parameter has default argument
        # "S324", # Probable use of insecure hash functions in `hashlib`: `sha1`
    ]
